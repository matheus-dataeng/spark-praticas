services:

  spark:
    build:
      context: .

    container_name: curso-spark

    volumes:
      - ./:/workspace

    working_dir: /workspace

    ports:
      - "8888:8888"

    depends_on:
      postgres:
        condition: service_healthy

    tty: true
    stdin_open: true

    command: >
      bash -c "
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --allow-root
      --NotebookApp.token=''
      "

  postgres:
    image: postgres:16

    container_name: curso-spark-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: